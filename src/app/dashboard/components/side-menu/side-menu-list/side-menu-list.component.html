<!-- Dashboard Item (Active) -->
<a [routerLink]="'/dashboard'" routerLinkActive="bg-[#1b3553] text-white border-l-4 border-sky-400"
    class="flex items-center gap-x-3 py-2.5 px-3 text-sm rounded-r-lg font-semibold text-slate-300 hover:bg-[#1b3553] hover:text-white focus:outline-none focus:bg-[#1b3553] transition-colors duration-200"
    [routerLinkActiveOptions]="{ exact: true }">
    <app-custom-icon [name]="'house'" [color]="'#cbd5e1'"></app-custom-icon>
    Inicio
</a>


<!-- Menu dinámico (grupo de acordeones) -->
@if(accesosLoading()){
    <div class="p-3 text-sm text-slate-400 flex items-center gap-2">
        <svg class="animate-spin h-4 w-4 text-slate-400" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        Cargando menú...
    </div>
} @else if (accesos().length === 0) {
    <div class="p-3 text-sm text-slate-400">Sin accesos asignados</div>
} @else {
<div class="hs-accordion-group" id="side-menu-accordion-group">
    @for(acceso of accesos(); track acceso.id){
        <!-- Item de acordeón por cada acceso -->
        <div class="hs-accordion" [id]="acceso.id">
            <button type="button"
                class="hs-accordion-toggle w-full flex items-center gap-x-3 py-2.5 px-3 text-sm font-semibold text-slate-300 hover:bg-[#1b3553] hover:text-white rounded-lg  focus:outline-none focus:bg-[#1b3553] transition-colors duration-200"
                [id]="acceso.id + '-btn'"
                aria-expanded="false"
                [attr.aria-controls]="acceso.id + '-content'"
                [attr.data-hs-accordion]="'#' + (acceso.id + '-content')">
                <app-custom-icon [name]="acceso.menu.icono" [color]="'#cbd5e1'"></app-custom-icon>
                {{acceso.menu.label}}
                <svg class="hs-accordion-active:rotate-180 shrink-0 size-4 ml-auto transition-transform duration-200"
                    xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6" />
                </svg>
            </button>

            <div
                class="hs-accordion-content w-full overflow-hidden transition-[height] duration-300 hidden"
                role="region"
                [id]="acceso.id + '-content'"
                [attr.aria-labelledby]="acceso.id + '-btn'">
                <div class="pl-6 space-y-1 mt-1">
                    @for(submenu of acceso.subMenus; track submenu.id){
                        <a [routerLink]="prefix + submenu.menu.pathWeb"
                            routerLinkActive="bg-[#1b3553] text-white border-l-4 border-sky-400"
                            class="flex items-center gap-x-3 py-2 px-3 text-sm  font-medium text-slate-300 hover:bg-[#1b3553] hover:text-white focus:outline-none focus:bg-[#1b3553] transition-colors duration-200">
                            <app-custom-icon [name]="submenu.menu.icono" [size]="15" [color]="submenu.menu.color"></app-custom-icon>
                            {{submenu.menu.label}}
                        </a>
                    }
                </div>
            </div>
        </div>
    }
</div>
}
