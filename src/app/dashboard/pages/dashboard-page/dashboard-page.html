

<!-- Layout principal -->
<div class="flex min-h-screen">

  <!-- Sidebar -->
  <div
    id="hs-sidebar-header"
    class="fixed bg-[#0f2138]  border-r border-[#1b3553] inset-y-0 left-0 z-40 w-64 transform transition-transform duration-300 ease-in-out lg:translate-x-0 lg:static lg:inset-auto "
    [class.-translate-x-full]="!isSidebarOpen"
    [class.translate-x-0]="isSidebarOpen">

    <app-side-menu (closeSidebar)="closeSidebar()"></app-side-menu>
  </div>

  <div class="flex flex-col flex-1 ">
    <!-- Top Navigation Bar -->
    <app-nav-bar class="block w-full border-b border-[#1b3553]" (openToggleSidebar)="toggleSidebar()"></app-nav-bar>

    <!-- Overlay (solo móvil) -->
    <div
      class="fixed inset-0 bg-black/50 z-30 transition-opacity duration-300 lg:hidden"
      [class.opacity-100]="isSidebarOpen"
      [class.opacity-0]="!isSidebarOpen"
      [class.pointer-events-none]="!isSidebarOpen"
      (click)="closeSidebar()"
    ></div>

    <!-- Contenido principal -->
    <main class="flex-1  bg-[#f1f5f9] transition-all duration-300 p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
